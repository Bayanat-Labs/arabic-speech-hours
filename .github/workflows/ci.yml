name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install the package and the test tools
        run: python -m pip install ".[test]"
      - name: Run the tests
        run: python -m pytest -q
      - name: Rebuild the published tables from the committed evidence
        run: |
          python scripts/build.py --as-of "$(python -c 'import json;print(json.load(open("feed/latest.json"))["as_of"])')"
          git diff --exit-code -- feed/latest.json data/corpora.csv data/overlap.csv
