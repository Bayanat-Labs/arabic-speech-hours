name: Refresh the counter

# Started by hand only. Re-reads the published metadata, re-fetches the evidence pages, runs the
# discovery queries, rebuilds the tables and runs the second check (a separate script that does not
# import the package). The results are uploaded as a workflow artifact for review; nothing is
# committed or published by this workflow.

on:
  workflow_dispatch:
    inputs:
      as_of:
        description: "As-of date for the new figures (YYYY-MM-DD)"
        required: true

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python -m pip install ".[test]"
      - name: Measure hours from metadata (one request per second per host)
        run: python scripts/measure.py
      - name: Fetch the evidence pages
        run: python scripts/snapshot.py --out refresh-snapshots
      - name: Discover candidates
        run: python scripts/discover.py
      - name: Build, check, rebuild
        run: |
          python scripts/build.py --as-of "${{ inputs.as_of }}"
          python scripts/second_check.py --snapshots refresh-snapshots || true
          python scripts/build.py --as-of "${{ inputs.as_of }}"
          python scripts/second_check.py --snapshots refresh-snapshots || true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: refresh-${{ inputs.as_of }}
          path: |
            data/
            feed/
            qa/
            evidence/measurements/
            evidence/candidates.json
            refresh-snapshots/index.jsonl
