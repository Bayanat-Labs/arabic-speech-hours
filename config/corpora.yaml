# Watched Arabic speech corpora. One entry per corpus; each entry has one licence class for its audio
# and one or more rows (partitions by hour type, dialect, genre or split). Hours come from a
# measurement in measurements.yaml (computed) or from a quoted statement in a saved snapshot (stated).
# Quotes are exact spans of the snapshot text; numbers in a quote are re-read by the second check.
version: 2026.10.30
priority:   # for overlap adjustment within a licence class: earlier entries keep shared hours
  [common-voice-ar, yodas3-ar, yodas2-ar, masc, arabic-speech-corpus, arvoice, clartts, fleurs-ar, mediaspeech-ar,
   adi17, adi20, sada, qasr, mgb2, casablanca, mixat, tarteel-recitations]
corpora:

- corpus_id: common-voice-ar
  name: Common Voice Scripted Speech 27.0, Arabic
  publisher: Mozilla Common Voice (Mozilla Foundation)
  homepage_url: https://mozilladatacollective.com/datasets/cmu5wom3z00ceo107guxtg4xa
  version: 27.0 (cv-corpus-27.0-2026-09-11)
  release_date: 2026-09-17
  access: download page
  platform_caveat: null
  licence:
    string: CC0-1.0
    declared: cc0-1.0
    url: https://mozilladatacollective.com/datasets/cmu5wom3z00ceo107guxtg4xa
    quote: Creative Commons Zero v1.0 Universal (CC0-1.0)
    snapshot: common-voice-ar/mdc-page
  additional_terms_quote: It is forbidden to re-host or re-share this dataset.
  notes: The download page adds conditions to the CC0 licence (no attempt to identify speakers; no re-hosting). Release statistics from the Common Voice cv-dataset repository; no dialect field. The Spontaneous Speech 5.0 release statistics list no Arabic locale.
  rows:
  - {hour_type: released_audio, dialect_group: unlabelled, genre: read, hours_method: computed_from_release_stats,
     measurement: common-voice-ar-27, field: seconds,
     cross_check_quote: "The dataset contains 136832 clips representing 158.27 hours of recorded speech (93.34 hours validated)",
     cross_check_snapshot: common-voice-ar/mdc-page}
  - {hour_type: validated, dialect_group: unlabelled, genre: read, hours_method: computed_from_release_stats,
     measurement: common-voice-ar-27, field: valid_seconds}

- corpus_id: yodas3-ar
  name: YODAS v3, Arabic subset
  publisher: ESPnet (Chen, Takamichi, Shiota, Fukayama, Cornell, Watanabe)
  homepage_url: https://huggingface.co/datasets/espnet/yodas3
  version: 81d802f45a1c1e1f5331260484dacf1fbea81981
  release_date: 2026-10-07
  access: open download
  platform_caveat: youtube
  licence:
    string: CC BY 3.0
    declared: cc-by-3.0
    url: https://huggingface.co/datasets/espnet/yodas3
    quote: originally released under a CC-BY-3.0 license
    snapshot: yodas3-ar/hf-card
  notes: Hours are the sum of the per-recording length column of the Arabic metadata files (data/ar/metadata); the publisher files recordings by the language of their caption track. Rows are split by the uploader-locale field of the same metadata (Arabic, another language, not given); the field describes the upload, not the speech. Unprocessed long-form audio. Recording IDs are publisher IDs, not source video IDs.
  rows:
  - {hour_type: released_audio, dialect_group: unlabelled, genre: mixed, hours_method: computed_from_metadata, partition: locale-ar,
     source_dialect_label: "caption track ar; uploader locale ar",
     measurement: yodas3-ar, field: seconds, filter: {locale_lang: {eq: ar}}}
  - {hour_type: released_audio, dialect_group: unlabelled, genre: mixed, hours_method: computed_from_metadata, partition: locale-other,
     source_dialect_label: "caption track ar; uploader locale another language",
     measurement: yodas3-ar, field: seconds, filter: {locale_lang: {ne: ar, notnull: true}}}
  - {hour_type: released_audio, dialect_group: unlabelled, genre: mixed, hours_method: computed_from_metadata, partition: locale-none,
     source_dialect_label: "caption track ar; uploader locale not given",
     measurement: yodas3-ar, field: seconds, filter: {locale_lang: {isnull: true}}}

- corpus_id: yodas2-ar
  name: YODAS2, Arabic subset (ar000)
  publisher: ESPnet (Li, Takamichi, Saeki, Chen, Shiota, Watanabe)
  homepage_url: https://huggingface.co/datasets/espnet/yodas2
  version: 631fc446cb1a41ee93a1d390a167c6e08c2597a3
  release_date: 2026-10-22
  access: open download
  platform_caveat: youtube
  licence:
    string: CC BY 3.0
    declared: cc-by-3.0
    url: https://huggingface.co/datasets/espnet/yodas2
    quote: "cc-by-3.0"
    snapshot: yodas2-ar/hf-card
  notes: Hours are the sum of the per-recording duration manifests of the ar000 subset (data/ar000/duration). The publisher states that YODAS2 holds the same recordings as YODAS v1 in long-form layout, so YODAS v1 is not counted separately.
  rows:
  - {hour_type: released_audio, dialect_group: unlabelled, genre: mixed, hours_method: computed_from_metadata,
     measurement: yodas2-ar, field: seconds}

- corpus_id: masc
  name: "MASC: Massive Arabic Speech Corpus"
  publisher: Al-Fetyani, Al-Barham, Abandah, Alsharkawi, Dawas (University of Jordan)
  homepage_url: https://ieee-dataport.org/open-access/masc-massive-arabic-speech-corpus
  version: IEEE DataPort, last updated 2025-04-28 (DOI 10.21227/e1qb-jv46)
  release_date: 2021-08-18
  access: free account required
  access_quote: Open Access dataset files are accessible to all logged in users.
  platform_caveat: youtube
  licence:
    string: CC BY 4.0
    declared: cc-by-4.0
    url: https://ieee-dataport.org/open-access/masc-massive-arabic-speech-corpus
    quote: '"license": "https://creativecommons.org/licenses/by/4.0/"'
    snapshot: masc/ieee-dataport
    snapshot_part: html
    found_in: the dataset metadata of the publisher's IEEE DataPort page; the visible page text states no licence
    found_in_ar: البيانات الوصفية لصفحة الناشر على IEEE DataPort، ولا يذكر نص الصفحة الظاهر أي ترخيص
    copies:   # third-party copies on the Hugging Face Hub, licence as each card declares it
    - {repo: pain/MASC, licence: CC BY 4.0, snapshot: masc/copy-pain}
    - {repo: hirundo-io/MASC, licence: CC BY 4.0, snapshot: masc/copy-hirundo}
    - {repo: MohamedRashad/MASC-Arabic, licence: CC BY 4.0, snapshot: masc/copy-mohamedrashad}
    - {repo: abdusah/masc, licence: CC BY-NC 4.0, snapshot: masc/copy-abdusah}
  notes: The publisher page declares CC BY 4.0 in its dataset metadata. Copies on the Hub declare CC BY 4.0 (pain/MASC, hirundo-io/MASC, MohamedRashad/MASC-Arabic) or CC BY-NC 4.0 (abdusah/masc); the publisher's licence is used. Transcribed hours are computed from the segment tables (clean and noisy subsets) of the pain/MASC copy.
  rows:
  - {hour_type: released_audio, dialect_group: mixed, source_dialect_label: multi-dialect (publisher description), genre: mixed,
     hours_method: card_or_paper_stated, stated_hours: 1000,
     quote: "MASC is a dataset that contains 1,000 hours of speech sampled at 16 kHz", snapshot: masc/ieee-dataport,
     locator: IEEE DataPort page, abstract}
  - {hour_type: transcribed, dialect_group: mixed, source_dialect_label: multi-dialect (publisher description), genre: mixed,
     hours_method: computed_from_metadata, measurement: masc-transcribed, field: seconds,
     locator: "pain/MASC transcript/{train,dev,test}.csv, duration column"}

